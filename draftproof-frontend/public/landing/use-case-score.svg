<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e1f5ee"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0d1b2a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="800" height="500" rx="34" fill="url(#bg)"/>
  <!-- the score: a dial that tells you nothing actionable -->
  <g filter="url(#s)">
    <rect x="78" y="150" width="210" height="210" rx="28" fill="#fff"/>
    <circle cx="183" cy="245" r="64" fill="none" stroke="#0d1b2a" stroke-width="14" opacity=".12"/>
    <path d="M183 181a64 64 0 0 1 52 101" fill="none" stroke="#3ba876" stroke-width="14" stroke-linecap="round" opacity=".5"/>
    <rect x="150" y="232" width="66" height="16" rx="8" fill="#0d1b2a" opacity=".22"/>
    <rect x="161" y="262" width="44" height="10" rx="5" fill="#0d1b2a" opacity=".13"/>
  </g>
  <!-- arrow: score becomes fixes -->
  <path d="M300 255h70" fill="none" stroke="#0f6e56" stroke-width="9" stroke-linecap="round"/>
  <path d="M360 240l18 15-18 15" fill="none" stroke="#0f6e56" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the fixes: specific, checkable steps -->
  <g filter="url(#s)">
    <rect x="404" y="92" width="318" height="316" rx="24" fill="#fff"/>
    <g transform="translate(440 140)">
      <circle cx="0" cy="0" r="17" fill="#3ba876"/>
      <path d="M-8 0l6 6 12-15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="36" y="-14" width="210" height="14" rx="7" fill="#0d1b2a" opacity=".18"/>
      <rect x="36" y="8" width="150" height="11" rx="5.5" fill="#0d1b2a" opacity=".11"/>
    </g>
    <g transform="translate(440 222)">
      <circle cx="0" cy="0" r="17" fill="#3ba876"/>
      <path d="M-8 0l6 6 12-15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="36" y="-14" width="186" height="14" rx="7" fill="#0d1b2a" opacity=".18"/>
      <rect x="36" y="8" width="168" height="11" rx="5.5" fill="#0d1b2a" opacity=".11"/>
    </g>
    <g transform="translate(440 304)">
      <circle cx="0" cy="0" r="17" fill="#3ba876"/>
      <path d="M-8 0l6 6 12-15" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="36" y="-14" width="226" height="14" rx="7" fill="#0d1b2a" opacity=".18"/>
      <rect x="36" y="8" width="132" height="11" rx="5.5" fill="#0d1b2a" opacity=".11"/>
    </g>
  </g>
</svg>
