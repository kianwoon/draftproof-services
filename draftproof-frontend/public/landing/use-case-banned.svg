    <path d="M615 248l9 9 18-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the signature reaching the shield -->
  <path d="M498 332c44-2 70-26 84-66" fill="none" stroke="#0f6e56" stroke-width="6" stroke-linecap="round"/>
</svg>
