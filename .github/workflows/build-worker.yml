name: Build & Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'poc/**'
      - '.github/workflows/build-worker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kianwoon/draftproof-worker
  SERVICE_ID: "2af91bbc-6519-4559-a3cc-1b6349ce020e"

jobs:
  # ── Detect what changed ──────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'worker/Dockerfile'
              - 'worker/requirements.txt'
              - 'worker/entrypoint.sh'
            code:
              - 'poc/**'
              - 'worker/app/**'

  # ── Fast path: code-only changes (poc/ edits) ───────────────
  # Skips Docker rebuild. Just triggers Koyeb redeploy;
  # the worker's entrypoint.sh does git pull to get latest code.
  code-deploy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy (no image rebuild)
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          echo "Code-only change — skipping Docker build"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            echo "$BODY" | jq '.' >&2 || echo "$BODY" >&2
            exit 1
          fi
          echo "Koyeb redeploy triggered (code-only, ~30s deploy)"

  # ── Full path: Docker image rebuild ─────────────────────────
  # Only when worker infra files change (Dockerfile, requirements,
  # entrypoint.sh). Also runs when both code + infra change.
  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Koyeb via GHCR image
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          # Volume ID for /app/hf_cache — always included to prevent accidental detach
          HF_VOLUME_ID: "eeb30e19"
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/kianwoon/draftproof-worker:sha-${SHORT_SHA}"
          echo "Deploying ${IMAGE} to Koyeb..."
          # Always include volumes in the PATCH — Koyeb shallow-merges definition,
          # so omitting volumes would silently detach the HF model cache volume.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"definition\":{\"docker\":{\"image\":\"${IMAGE}\",\"image_registry_secret\":\"e3888d3f\"},\"volumes\":[{\"id\":\"${HF_VOLUME_ID}\",\"path\":\"/app/hf_cache\"}]}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb deploy failed"
            echo "$BODY" | jq '.' >&2
            exit 1
          fi
          echo "Koyeb deploy triggered successfully (volume eeb30e19 → /app/hf_cache preserved)"
