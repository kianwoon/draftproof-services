name: Build & Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'poc/**'
      - '.github/workflows/build-worker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kianwoon/draftproof-worker
  SERVICE_ID: "2af91bbc-6519-4559-a3cc-1b6349ce020e"

jobs:
  # ── Detect what changed ──────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            infra:
              - 'worker/Dockerfile'
              - 'worker/requirements.txt'
              - 'worker/entrypoint.sh'
            code:
              - 'poc/**'
              - 'worker/app/**'

  # ── Fast path: code-only changes (poc/ edits) ───────────────
  # Skips Docker rebuild. Just triggers Koyeb redeploy;
  # the worker's entrypoint.sh does git pull to get latest code.
  code-deploy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy (no image rebuild)
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          echo "Code-only change — skipping Docker build"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            echo "$BODY" | jq '.' >&2 || echo "$BODY" >&2
            exit 1
          fi
          echo "Koyeb redeploy triggered (code-only, ~30s deploy)"

  # ── Full path: Docker image rebuild ─────────────────────────
  # Only when worker infra files change (Dockerfile, requirements,
  # entrypoint.sh). Also runs when both code + infra change.
  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Koyeb via GHCR image
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          set -o pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/kianwoon/draftproof-worker:sha-${SHORT_SHA}"
          echo "Deploying ${IMAGE} to Koyeb..."
          # Koyeb PATCH /v1/services does NOT shallow-merge: a partial definition is
          # rejected as bad_request (and would also drop the env vars, scaling, regions,
          # volumes, etc.). The definition lives on the DEPLOYMENT, not the service. So:
          # fetch the active deployment's FULL definition and change ONLY docker.image
          # (the runbook recovery pattern). This preserves all 69 env vars, the HF volume,
          # scaling, regions, and the registry secret -- no hardcoded partial payload.
          ADID=$(curl -sf -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}" | jq -r '.service.active_deployment_id')
          if [ -z "$ADID" ] || [ "$ADID" = "null" ]; then
            echo "ERROR: could not read active_deployment_id"; exit 1
          fi
          DEF=$(curl -sf -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/deployments/${ADID}" | jq -c '.deployment.definition')
          if [ -z "$DEF" ] || [ "$DEF" = "null" ]; then
            echo "ERROR: could not read active deployment definition"; exit 1
          fi
          NEW_DEF=$(echo "$DEF" | jq -c --arg img "$IMAGE" '.docker.image = $img')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"definition\":${NEW_DEF}}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb deploy failed"
            echo "$BODY" | jq '.' >&2 || echo "$BODY" >&2
            exit 1
          fi
          echo "Koyeb deploy triggered (full definition preserved: env, volumes, scaling, regions)."
