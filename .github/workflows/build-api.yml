name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - '.github/workflows/build-api.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kianwoon/draftproof-api
  SERVICE_ID: "9f8a08f0-65d9-40f2-a9a2-636ea2e1a741"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Koyeb via GHCR image
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          echo "Deploying ghcr.io/kianwoon/draftproof-api:latest to Koyeb..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"definition":{"docker":{"image":"ghcr.io/kianwoon/draftproof-api:latest","image_registry_secret":"e3888d3f"}}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb deploy failed"
            echo "$BODY" | jq '.' >&2
            exit 1
          fi
          echo "Koyeb deploy triggered successfully"
