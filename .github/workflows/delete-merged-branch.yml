name: Delete merged branch

# When a pull request is merged into the base branch, delete its head branch.
# Only fires for branches that actually merged (not closed-without-merge), that
# live in this repo (not forks), and is never the default branch.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        uses: actions/github-script@v8
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (err) {
              if (err.status === 422) {
                core.info(`Branch already deleted: ${branch}`);
              } else {
                throw err;
              }
            }
