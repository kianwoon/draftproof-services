name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest commit to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICE_ID: "9f8a08f0-65d9-40f2-a9a2-636ea2e1a741"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Deploying commit ${COMMIT_SHA:0:7} to service ${SERVICE_ID}..."
          # GET current definition, only patch git.sha — pass everything else as-is
          CURRENT=$(curl -sf -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}")
          echo "Service keys: $(echo "$CURRENT" | jq 'keys')"
          echo "Latest deployment id: $(echo "$CURRENT" | jq '.service.latest_deployment.id // "NONE"')"
          DEFINITION=$(echo "$CURRENT" | jq '.service.latest_deployment.definition')
          echo "Definition keys: $(echo "$DEFINITION" | jq 'keys // "NULL"')"
          echo "Definition name: $(echo "$DEFINITION" | jq '.name // "NULL"')"
          UPDATED=$(echo "$DEFINITION" | jq --arg sha "$COMMIT_SHA" '.git.sha = $sha')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"definition\": $UPDATED}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$BODY" | jq -r '.deployment.status // "unknown"')
          DEPLOY_SHA=$(echo "$BODY" | jq -r '.deployment.definition.git.sha // "n/a"')
          echo "HTTP ${HTTP_CODE} — deployment ${STATUS} — sha ${DEPLOY_SHA:0:7}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb deploy failed"
            echo "$BODY" | jq '.' >&2
            exit 1
          fi
