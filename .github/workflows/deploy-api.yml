name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest commit to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICE_ID: "9f8a08f0-65d9-40f2-a9a2-636ea2e1a741"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Deploying commit ${COMMIT_SHA:0:7} to service ${SERVICE_ID}..."
          # Step 1: GET service to find latest deployment ID
          SVC=$(curl -sf -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}")
          DEPLOY_ID=$(echo "$SVC" | jq -r '.service.latest_deployment_id')
          echo "Latest deployment: ${DEPLOY_ID}"
          # Step 2: GET that deployment to get its definition
          DEPLOY=$(curl -sf -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/deployments/${DEPLOY_ID}")
          DEFINITION=$(echo "$DEPLOY" | jq '.deployment.definition')
          echo "Definition name: $(echo "$DEFINITION" | jq -r '.name')"
          # Step 3: Patch git.sha with the new commit
          UPDATED=$(echo "$DEFINITION" | jq --arg sha "$COMMIT_SHA" '.git.sha = $sha')
          # Step 4: PUT service with updated definition
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"definition\": $UPDATED}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$BODY" | jq -r '.deployment.status // "unknown"')
          DEPLOY_SHA=$(echo "$BODY" | jq -r '.deployment.definition.git.sha // "n/a"')
          echo "HTTP ${HTTP_CODE} — deployment ${STATUS} — sha ${DEPLOY_SHA:0:7}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb deploy failed"
            echo "$BODY" | jq '.' >&2
            exit 1
          fi
