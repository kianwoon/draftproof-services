name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          APP_NAME: "draftproof"
          SERVICE_NAME: "draftproof"
        run: |
          # Debug: list apps
          APPS_RAW=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/apps")
          APPS_HTTP=$(echo "$APPS_RAW" | tail -1)
          APPS_BODY=$(echo "$APPS_RAW" | sed '$d')
          echo "GET /v1/apps HTTP ${APPS_HTTP}"
          echo "${APPS_BODY}" | jq '.' | head -80

          # Get service ID for draftproof/draftproof
          SERVICE_ID=$(echo "${APPS_BODY}" | jq -r '[.apps[] | select(.name == "draftproof") | .updated_services // .services // [] | .[] | select(.name == "draftproof") | .id] | first // empty')
          echo "Resolved SERVICE_ID=${SERVICE_ID}"

          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: Could not find service draftproof/draftproof"
            exit 1
          fi

          echo "Redeploying service ${SERVICE_ID}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: ${HTTP_CODE}"
          echo "Response: ${BODY}" | head -50
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            exit 1
          fi
