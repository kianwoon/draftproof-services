name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          APP_ID: "d33cd2b0-feeb-4249-8ea1-f348bf544ac2"
          SERVICE_ID: "9f8a08f0-65d9-40f2-a9a2-636ea2e1a741"
        run: |
          echo "Redeploying service ${SERVICE_ID}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$BODY" | jq -r '.deployment.status // "unknown"')
          echo "HTTP ${HTTP_CODE} — deployment ${STATUS}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            echo "$BODY" | jq '.' >&2
            exit 1
          fi
