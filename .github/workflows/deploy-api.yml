name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb API redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICE_ID: "c70d5b2b-52e8-4ed3-8f79-a7c727e60320"
        run: |
          curl -sf -X POST "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json" | jq '.deployment.status'
