name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'draftproof-api/**'
      - 'draftproof-frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          APP_NAME: "draftproof"
          SERVICE_NAME: "draftproof"
        run: |
          # Get service ID from /v1/services
          SVC_RAW=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/services?app_id=d33cd2b0-feeb-4249-8ea1-f348bf544ac2&name=draftproof")
          SVC_HTTP=$(echo "$SVC_RAW" | tail -1)
          SVC_BODY=$(echo "$SVC_RAW" | sed '$d')
          echo "Services lookup HTTP ${SVC_HTTP}"
          echo "${SVC_BODY}" | jq '.' | head -30

          SERVICE_ID=$(echo "${SVC_BODY}" | jq -r '.services[0].id // empty')
          echo "Resolved SERVICE_ID=${SERVICE_ID}"

          if [ -z "$SERVICE_ID" ]; then
            echo "Listing all services to find match..."
            ALL_SVCS=$(curl -s -H "Authorization: Bearer ${KOYEB_TOKEN}" "https://app.koyeb.com/v1/services")
            echo "${ALL_SVCS}" | jq -r '.services[] | "\(.name) \(.id)"'
            exit 1
          fi

          echo "Redeploying service ${SERVICE_ID}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: ${HTTP_CODE}"
          echo "Response: ${BODY}" | head -50
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            exit 1
          fi
