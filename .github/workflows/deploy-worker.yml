name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'poc/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          APP_ID: "d33cd2b0-feeb-4249-8ea1-f348bf544ac2"
        run: |
          # Look up worker service ID
          SVC_RAW=$(curl -s -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/services?app_id=${APP_ID}")
          SERVICE_ID=$(echo "$SVC_RAW" | jq -r '.services[] | select(.name == "draftproof-worker") | .id')
          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: Could not find draftproof-worker service"
            echo "$SVC_RAW" | jq -r '.services[] | "\(.name) \(.id)"' >&2
            exit 1
          fi
          echo "Redeploying service ${SERVICE_ID}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$BODY" | jq -r '.deployment.status // "unknown"')
          echo "HTTP ${HTTP_CODE} — deployment ${STATUS}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            echo "$BODY" | jq '.' >&2
            exit 1
          fi
