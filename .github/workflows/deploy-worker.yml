name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'poc/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          APP_NAME: "draftproof"
          SERVICE_NAME: "draftproof-worker"
        run: |
          # Look up service ID from app/service name
          SERVICE_ID=$(curl -sf \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            "https://app.koyeb.com/v1/apps" \
            | jq -r ".apps[] | select(.name == \"${APP_NAME}\") | .services[] | select(.name == \"${SERVICE_NAME}\") | .id")
          if [ -z "$SERVICE_ID" ]; then
            echo "ERROR: Could not find service ${APP_NAME}/${SERVICE_NAME}"
            exit 1
          fi
          echo "Redeploying service ${SERVICE_ID}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.koyeb.com/v1/services/${SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: ${HTTP_CODE}"
          echo "Response: ${BODY}" | head -50
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Koyeb redeploy failed"
            exit 1
          fi
