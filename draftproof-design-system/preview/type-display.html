<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--surface-soft); padding: 26px 30px; }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 116px; flex: 0 0 116px; letter-spacing: .04em; }
  .s1 { font-size: 3.2rem; font-weight: 600; color: var(--navy-950); line-height: 1; letter-spacing: 0; }
  .s2 { font-size: 2.3rem; font-weight: 600; color: var(--navy-950); line-height: 1.1; }
  .s3 { font-size: 1rem; font-weight: 500; color: var(--navy-900); }
</style>
</head>
<body>
  <div class="row"><span class="tag">H1 · Inter 600</span><span class="s1">Prove your work</span></div>
  <div class="row"><span class="tag">H2 · Inter 600</span><span class="s2">Reviews you can act on</span></div>
  <div class="row"><span class="tag">H3 · Inter 500</span><span class="s3">Citation gaps matter</span></div>
</body>
</html>
