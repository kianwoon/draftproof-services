<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--surface-soft); padding: 26px 30px; }
  .block { margin-bottom: 16px; }
  .eyebrow { margin-bottom: 8px; }
  .body { color: var(--muted); font-size: 1rem; max-width: 560px; margin: 0; }
  .mono-row { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .mono { font-size: 13px; color: var(--green-dark); }
  .mlab { font-family: var(--font-mono); font-size: 10px; color: var(--muted); display: block; margin-bottom: 6px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="block">
    <p class="eyebrow">Writing integrity reviews</p>
    <p class="body">Body copy is Inter at 1rem / 1.7 line-height in muted slate. The uppercase eyebrow above sits at 12px with +0.8px tracking.</p>
  </div>
  <div class="mono-row">
    <span class="mlab">MONOSPACE — code-texture motif only</span>
    <span class="mono">source.check()&nbsp;&nbsp;citation.match&nbsp;&nbsp;grounded=true&nbsp;&nbsp;0101</span>
  </div>
</body>
</html>
