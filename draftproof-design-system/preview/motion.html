<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--surface-soft); padding: 26px 30px; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: .04em; margin-bottom: 6px; }
  .track { height: 8px; background: var(--line); border-radius: 99px; position: relative; overflow: hidden; max-width: 460px; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 30%; background: var(--green); border-radius: 99px; animation: run 2.6s var(--ease) infinite; }
  @keyframes run { 0%{width:8%} 55%{width:88%} 100%{width:8%} }
  .chips { display: flex; gap: 10px; margin-top: 22px; }
  .chip { padding: 9px 16px; border-radius: 8px; background: var(--green); color: #fff; font-size: 13px; font-weight: 500; transition: transform .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease); }
  .chip:hover { transform: translateY(-1px); background: var(--green-dark); box-shadow: var(--shadow-sm); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 18px; }
  .meta code { font-family: var(--font-mono); color: var(--navy-900); }
</style>
</head>
<body>
  <div class="lab">HOUSE EASING — cubic-bezier(.22, 1, .36, 1) · 150–200ms</div>
  <div class="track"><div class="fill"></div></div>
  <div class="chips"><span class="chip">Hover me → lift &amp; darken</span></div>
  <p class="meta">One easing everywhere. Hover lifts <code>translateY(-1px)</code>; cards <code>-2px</code>. No bounce, no spring, no scale.</p>
</body>
</html>
