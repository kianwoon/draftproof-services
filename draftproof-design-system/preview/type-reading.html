<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--surface); padding: 26px 30px; }
  .lab { font-family: var(--font-mono); font-size: 11px; color: var(--green-dark); letter-spacing: .04em; margin-bottom: 10px; }
  .doc { font-family: var(--font-read); font-size: 1.05rem; line-height: 1.82; color: #172033; max-width: 600px; }
  .doc em { background: rgba(58,168,118,.16); font-style: normal; padding: 0 2px; border-radius: 3px; }

<body>
  <div class="lab">READING VOICE — Georgia serif · the user's writing, report body & rewrite diff</div>
  <p class="doc">The Renaissance reshaped European thought, <em>yet this claim needs a source</em>. DraftProof renders the author's prose in serif — a deliberate second register that signals this text is being read, not just processed.</p>
