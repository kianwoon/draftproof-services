<!-- allow-hardcode: add-on sidebar UI (HTML/CSS + google.script.run calls + status
     strings), not scoring/matching logic. All detection happens server-side. -->
<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0D1B2A; --muted: #7A8694; --line: rgba(13,27,42,.10);
        --green: #3BA876; --green-dark: #0F6E56; --bg: #fff; --soft: #F4F2EE; --mint: #E1F5EE;
        --red: #E24B4A; --gold: #C9973A;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; font-family: Inter, "Noto Sans SC", system-ui, "Segoe UI", sans-serif; color: var(--ink); font-size: 14px; line-height: 1.6; }
      #app { padding: 14px; }
      .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
      .head-row h1 { margin: 0; font-family: Georgia, serif; font-size: 19px; }
      .sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
      .head-scores { display: flex; gap: 6px; }
      .score-badge { display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--soft); font-size: 12px; white-space: nowrap; }
      .score-badge .lbl { color: var(--muted); font-weight: 600; }
      .score-badge .val { font-weight: 700; font-variant-numeric: tabular-nums; }
      label { font-weight: 600; display: block; margin-bottom: 4px; }
      input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
      .btn-primary { background: var(--green); border-color: var(--green); color: #fff; width: 100%; }
      .btn-primary:hover:not(:disabled) { background: var(--green-dark); }
      .btn:disabled { opacity: .55; cursor: default; }
      .link { background: none; border: none; padding: 0; color: var(--green-dark); cursor: pointer; font: inherit; text-decoration: underline; }
      .hint, .keyline { color: var(--muted); margin: 6px 0 0; font-size: 13px; }
      a { color: var(--green-dark); }
      .err { color: var(--red); margin: 6px 0 0; }
      .stack { display: flex; flex-direction: column; gap: 10px; }
      .selbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--soft); }
      .selbox-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
      .seltext { margin: 0; font-size: 12.5px; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
      .wc-low { color: var(--gold); }
      .status { margin-top: 10px; color: var(--muted); min-height: 1em; }
      .status:empty { display: none; }
      .result { margin-top: 8px; }
      .metrics { display: grid; grid-template-columns: auto auto; gap: 6px 14px; margin: 0; }
      .metrics dt { color: var(--muted); } .metrics dd { margin: 0; font-weight: 600; text-align: right; }
      .section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
      .section-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
      .section-note { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
      .q-list { list-style: none; margin: 8px 0 0; padding: 0; }
      .q-list li { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
      .q-list li:first-child { border-top: 0; }
      .q-num { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; background: var(--mint); color: var(--green-dark); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
      .q-quote { margin: 0 0 4px; font-style: italic; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
      .q-text { margin: 0; font-size: 13px; line-height: 1.5; }
      .issue { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--soft); }
      .issue-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
      .issue-tier { font-size: 11px; padding: 2px 8px; border-radius: 999px; text-transform: capitalize; background: var(--soft); }
      .issue-tier.t-green, .issue-tier.t-clean { background: var(--mint); color: var(--green-dark); }
      .issue-tier.t-amber, .issue-tier.t-medium, .issue-tier.t-concerning { background: #fdf3e2; color: #9a6212; }
      .issue-tier.t-red, .issue-tier.t-high, .issue-tier.t-critical, .issue-tier.t-strong { background: #fdeaea; color: #b32b22; }
      .issue-sig { font-size: 11px; color: var(--muted); }
      .issue-snippet { margin: 0 0 6px; font-size: 12.5px; line-height: 1.5; }
      /* Clickable finding text: jumps to + highlights the passage in the document. */
      .locate { cursor: pointer; border-radius: 4px; transition: background .12s, box-shadow .12s; }
      .locate:hover { background: var(--mint); box-shadow: inset 2px 0 0 var(--green-dark); padding-left: 6px; }
      .version-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .version-row label { font-size: 12px; font-weight: 600; color: var(--muted); }
      .version-select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
      .newscan-btn { margin-left: auto; font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border: 1px solid var(--green-dark); border-radius: 6px; background: #fff; color: var(--green-dark); cursor: pointer; }
      .newscan-btn:hover { background: var(--mint); }
      .version-caption { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
      .issue-summary { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
      .issue-block { margin-top: 6px; }
      .issue-label { display: block; font-size: 11px; font-weight: 700; color: var(--green-dark); text-transform: uppercase; letter-spacing: .03em; }
      .issue-block p { margin: 2px 0 0; font-size: 12.5px; line-height: 1.5; }
      .lowconf { margin-top: 12px; padding: 8px 10px; background: #fdf3e2; border-radius: 6px; color: #7a5410; font-size: 12.5px; }
      .report-link { display: inline-block; margin-top: 14px; font-weight: 600; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="head-row">
        <h1>DraftProof</h1>
        <div id="headScores" class="head-scores" hidden></div>
      </div>
      <p class="sub">Scan highlighted text for AI-writing risk.</p>

      <section id="setup" class="stack" hidden>
        <div>
          <label for="apiKey">API key</label>
          <input id="apiKey" type="password" placeholder="dp_live_…" autocomplete="off" spellcheck="false" />
        </div>
        <button id="saveKey" class="btn btn-primary">Save key</button>
        <p class="hint">Generate a key at <a href="https://draftproof.app/api-keys" target="_blank" rel="noopener">draftproof.app/api-keys</a>.</p>
        <p id="setupError" class="err" hidden></p>
      </section>

      <section id="scanner" class="stack" hidden>
        <p class="keyline">Key <code id="keyPrefix"></code> · <button id="changeKey" class="link" type="button">change</button></p>
        <div class="selbox">
          <div class="selbox-head">
            <span>Selected text</span>
            <span><span id="wordCount">0 words</span> · <button id="refreshSel" class="link" type="button">refresh</button></span>
          </div>
          <p id="selText" class="seltext">Highlight text in the document, then refresh.</p>
        </div>
        <button id="scanBtn" class="btn btn-primary">Scan selected text</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="versionRow" class="version-row" hidden>
          <label for="versionSelect">Version</label>
          <select id="versionSelect" class="version-select"></select>
          <button id="newScanBtn" class="newscan-btn" type="button">New scan</button>
        </div>
        <div id="result" class="result" hidden></div>
      </section>
    </div>

    <script>
      var els = {};
      var scanning = false;
      var POLL_MS = 2000, POLL_MAX = 60;

      document.addEventListener('DOMContentLoaded', function () {
        ['apiKey','saveKey','setupError','keyPrefix','changeKey','refreshSel','selText','wordCount','scanBtn','status','result','setup','scanner','headScores','versionRow','versionSelect','newScanBtn']
          .forEach(function (id) { els[id] = document.getElementById(id); });
        els.saveKey.addEventListener('click', onSaveKey);
        els.changeKey.addEventListener('click', onChangeKey);
        els.refreshSel.addEventListener('click', refreshSelection);
        els.scanBtn.addEventListener('click', onScan);
        els.versionSelect.addEventListener('change', onVersionChange);
        els.newScanBtn.addEventListener('click', onNewScan);
        // Click a finding's quoted/snippet text → jump to + highlight it in the
        // doc. Delegated because the result HTML is re-rendered on every scan.
        els.result.addEventListener('click', function (e) {
          var el = e.target;
          while (el && el !== els.result && !(el.getAttribute && el.getAttribute('data-find'))) el = el.parentNode;
          if (!el || !el.getAttribute) return;
          var needle = el.getAttribute('data-find');
          if (!needle) return;
          setStatus('Locating…');
          google.script.run
            .withSuccessHandler(function (ok) { setStatus(ok ? '' : 'Couldn’t find that passage in the document.'); })
            .withFailureHandler(function () { setStatus('Couldn’t highlight that passage.'); })
            .highlightInDoc(needle, el.getAttribute('data-scope'));
        });
        google.script.run.withSuccessHandler(applyKeyInfo).withFailureHandler(showFatal).getKeyInfo();
      });

      function applyKeyInfo(info) {
        if (info && info.hasKey) {
          els.keyPrefix.textContent = info.prefix + '…';
          show(els.scanner); hide(els.setup);
          refreshSelection();
          loadVersions();   // populate the version picker + show the newest scan
        } else {
          show(els.setup); hide(els.scanner);
        }
      }

      function onSaveKey() {
        var v = (els.apiKey.value || '').trim();
        setupErr(null);
        google.script.run
          .withSuccessHandler(function (info) { els.apiKey.value = ''; applyKeyInfo(info); })
          .withFailureHandler(function (e) { setupErr(cleanErr(e)); })
          .saveKey(v);
      }

      function onChangeKey() {
        clearResult();
        els.versionSelect.innerHTML = ''; hide(els.versionRow);
        google.script.run.withSuccessHandler(applyKeyInfo).clearKey();
      }

      function refreshSelection() {
        google.script.run.withSuccessHandler(function (sel) {
          var n = sel.wordCount || 0;
          els.wordCount.textContent = n === 1 ? '1 word' : n + ' words';
          els.wordCount.className = (n > 0 && n < 100) ? 'wc-low' : '';
          els.selText.textContent = sel.text ? sel.text : 'Highlight text in the document, then refresh.';
          els.scanBtn.disabled = n === 0 && !scanning;
        }).previewSelection();
      }

      function onScan() {
        clearResult();
        busy(true);
        setStatus('Scanning… this can take up to a minute.');
        google.script.run
          .withSuccessHandler(function (r) { poll(r.scanId, r.lowConfidence, 0); })
          .withFailureHandler(function (e) { busy(false); handleErr(e); })
          .submitScan();
      }

      function poll(scanId, lowConfidence, attempt) {
        if (attempt >= POLL_MAX) { busy(false); setStatus('Still working — check the DraftProof dashboard shortly.'); return; }
        google.script.run
          .withSuccessHandler(function (data) {
            if (data.status === 'completed') { loadReport(scanId, lowConfidence); }
            else if (data.status === 'failed') { busy(false); setStatus('The scan failed. Please try again.'); }
            else { setTimeout(function () { poll(scanId, lowConfidence, attempt + 1); }, POLL_MS); }
          })
          .withFailureHandler(function (e) { busy(false); handleErr(e); })
          .getScanStatus(scanId);
      }

      // allow-hardcode: the strings below are HTML <option> render templates + data
      // attributes (presentation) and status text — not a scoring/matching list.
      function loadReport(scanId, lowConfidence) {
        google.script.run
          .withSuccessHandler(function (rep) {
            busy(false);
            // Record this scan as a new version, then label + show it.
            google.script.run
              .withSuccessHandler(function (scans) {
                var meta = findScan(scans, scanId);
                populateVersions(scans, scanId);
                renderReport(rep, { lowConfidence: lowConfidence, version: meta ? meta.version : null, savedAt: meta ? fmtTs(meta.ts) : '', restored: false });
              })
              .withFailureHandler(function () { renderReport(rep, { lowConfidence: lowConfidence }); })
              .recordScan(scanId, lowConfidence);
          })
          .withFailureHandler(function (e) { busy(false); handleErr(e); })
          .getScanReport(scanId);
      }

      // ── version history (per document) ───────────────────────────────────────
      function findScan(scans, scanId) {
        for (var i = 0; scans && i < scans.length; i++) { if (scans[i].scanId === scanId) return scans[i]; }
        return null;
      }
      function fmtTs(ms) { try { return new Date(ms).toLocaleString(); } catch (e) { return ''; } }

      // On open / key set: list this doc's scans, fill the picker, show the newest.
      function loadVersions() {
        google.script.run
          .withSuccessHandler(function (scans) {
            if (!scans || !scans.length) { hide(els.versionRow); return; }
            populateVersions(scans, scans[0].scanId);   // server returns newest-first
            loadVersion(scans[0].scanId, scans[0]);
          })
          .withFailureHandler(function () {})
          .listScans();
      }

      // Fill the dropdown (newest first). Label is version-only; time + meta ride
      // along as option attributes so switching needs no extra round-trip.
      function populateVersions(scans, selectedScanId) {
        if (!scans || !scans.length) { hide(els.versionRow); els.versionSelect.innerHTML = ''; return; }
        var h = '';
        for (var i = 0; i < scans.length; i++) {
          var s = scans[i];
          h += '<option value="' + escAttr(s.scanId) + '" data-version="' + s.version + '" data-ts="' + s.ts +
            '" data-lc="' + (s.lowConfidence ? '1' : '0') + '"' + (s.scanId === selectedScanId ? ' selected' : '') +
            ' title="' + escAttr(fmtTs(s.ts)) + '">v' + s.version + '.0</option>';
        }
        els.versionSelect.innerHTML = h;
        show(els.versionRow);
      }

      function onVersionChange() {
        var opt = els.versionSelect.options[els.versionSelect.selectedIndex];
        if (!opt || !opt.value) return;
        loadVersion(opt.value, { version: opt.getAttribute('data-version'), ts: Number(opt.getAttribute('data-ts')), lowConfidence: opt.getAttribute('data-lc') === '1' });
      }

      function loadVersion(scanId, meta) {
        var vlabel = meta ? ('v' + meta.version + '.0') : 'this version';
        setStatus('Loading ' + vlabel + '…');
        google.script.run
          .withSuccessHandler(function (rep) { setStatus(''); renderReport(rep, { lowConfidence: meta && meta.lowConfidence, version: meta ? meta.version : null, savedAt: meta ? fmtTs(meta.ts) : '', restored: true }); })
          .withFailureHandler(function () { setStatus('Couldn’t load ' + vlabel + ' — it may be offline.'); })
          .getScanReport(scanId);
      }

      // ── rendering (matches the Word add-in) ──────────────────────────────────
      function pct(v) { return v == null ? '—' : Math.round(v) + '%'; }
      function setHeadScores(rep) {
        var ai = rep && rep.ai_score != null ? pct(rep.ai_score) : null;
        var wq = rep && rep.writing_score != null ? pct(rep.writing_score) : null;
        if (ai == null && wq == null) { els.headScores.hidden = true; els.headScores.innerHTML = ''; return; }
        var h = '';
        if (ai != null) h += badge('AI', ai, rep.ai_score_note || 'Not a Turnitin score — a heads-up, not a verdict; detectors over-flag fluent writing');
        if (wq != null) h += badge('Writing', wq);
        els.headScores.innerHTML = h; els.headScores.hidden = false;
      }
      function badge(lbl, val, title) { return '<span class="score-badge"' + (title ? ' title="' + escAttr(title) + '"' : '') + '><span class="lbl">' + esc(lbl) + '</span><span class="val">' + esc(val) + '</span></span>'; }
      function humanize(s) { return String(s || '').replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }
      // Robust search needle from a finding's verbatim text: collapse whitespace, cap length.
      function findNeedle(t, max) {
        var s = String(t || '').replace(/\s+/g, ' ').trim();
        if (s.length <= max) return s;
        var cut = s.slice(0, max), sp = cut.lastIndexOf(' ');
        return (sp > 40 ? cut.slice(0, sp) : cut).trim();
      }

      function renderReport(rep, opts) {
        opts = opts || {};
        var lowConfidence = opts.lowConfidence;
        setStatus('');
        setHeadScores(rep);

        // Show the scanned text in the "Selected text" box so the result is
        // self-describing — a restored result has no live selection to show.
        if (rep.scanned_text) {
          els.selText.textContent = rep.scanned_text;
          var swc = rep.word_count != null ? rep.word_count : rep.scanned_text.split(/\s+/).filter(Boolean).length;
          els.wordCount.textContent = swc === 1 ? '1 word' : swc + ' words';
          els.wordCount.className = (swc > 0 && swc < 100) ? 'wc-low' : '';
        }

        var p = [];

        // Version caption — which scan you're viewing (fresh or restored).
        if (opts.version) p.push('<p class="version-caption">Version ' + opts.version + '.0' + (opts.savedAt ? ' · scanned ' + esc(opts.savedAt) : '') + (opts.restored ? '' : ' · new') + '</p>');

        var ct = rep.critical_thinking;
        if (ct && ct.questions && ct.questions.length) {
          var q = ct.questions.map(function (x, i) {
            var quote = x.quote ? '<p class="q-quote locate" data-scope="text" data-find="' + escAttr(findNeedle(x.quote, 200)) + '" title="Click to highlight this in your document">“' + esc(x.quote) + '”</p>' : '';
            return '<li><span class="q-num">' + (i + 1) + '</span><div>' + quote + '<p class="q-text">' + esc(x.question) + '</p></div></li>';
          }).join('');
          p.push('<div class="section"><div class="section-title">Critical thinking</div><p class="section-note">Questions to sharpen your thinking — the answers are yours to write.</p><ul class="q-list">' + q + '</ul></div>');
        } else if (ct && (ct.status || ct.score != null)) {
          p.push('<div class="section"><div class="section-title">Critical thinking</div><div>' + esc(ct.status || '—') + (ct.score != null ? ' · ' + Math.round(ct.score) + '/100' : '') + '</div></div>');
        }

        var sr = rep.submission_risk;
        if (sr && (sr.label || sr.level)) {
          // Show the LEVEL only (web-page parity): a raw '· 19%' next to 'Low' reads as
          // '<20% = Turnitin pass'. The web report shows the level word with no number; match it.
          var head = esc(sr.label || sr.level);
          // allow-hardcode: presentation note (honest detector caveat), not scoring logic.
          var srNote = 'Whether you can defend this as your own work — not a prediction of your ' +
            'Turnitin result. Detectors over-flag fluent writing and may flag this even though it\'s ' +
            'yours (a warning, not a verdict). The AI % above is NOT a Turnitin score.';
          if (sr.reason) srNote = sr.reason + ' ' + srNote;
          p.push('<div class="section"><div class="section-title">Submitted content</div><div>' + head + '</div><p class="section-note">' + esc(srNote) + '</p></div>');
        }

        var pis = rep.paragraph_issues || [];
        if (pis.length) {
          var cards = pis.map(function (it) {
            var chips = '';
            if (it.tier) chips += '<span class="issue-tier t-' + escAttr(it.tier) + '">' + esc(it.tier) + '</span>';
            if (it.signal_label) chips += '<span class="issue-sig">' + esc(humanize(it.signal_label)) + '</span>';
            var b = '';
            if (it.snippet) b += '<p class="issue-snippet locate" data-scope="paragraph" data-find="' + escAttr(findNeedle(it.snippet, 120)) + '" title="Click to highlight this paragraph in your document">' + esc(it.snippet) + '</p>';
            if (it.reader_summary) b += '<p class="issue-summary">' + esc(it.reader_summary) + '</p>';
            if (it.main_issue) b += '<div class="issue-block"><span class="issue-label">Main issue to fix</span><p>' + esc(it.main_issue) + '</p></div>';
            if (it.recommendation) b += '<div class="issue-block"><span class="issue-label">How to improve</span><p>' + esc(it.recommendation) + '</p></div>';
            return '<div class="issue">' + (chips ? '<div class="issue-chips">' + chips + '</div>' : '') + b + '</div>';
          }).join('');
          p.push('<div class="section"><div class="section-title">Issues</div>' + cards + '</div>');
        }

        if (lowConfidence) p.push('<p class="lowconf">Short selection — this read is indicative only. Scan a fuller passage (100+ words) for a confident result.</p>');
        if (rep.report_url) p.push('<a class="report-link" href="https://draftproof.app' + esc(rep.report_url) + '" target="_blank" rel="noopener">View full report ↗</a>');

        els.result.innerHTML = p.join(''); show(els.result);
      }

      // ── helpers ──────────────────────────────────────────────────────────────
      function show(el) { el.hidden = false; } function hide(el) { el.hidden = true; }
      function busy(on) { scanning = on; els.scanBtn.disabled = on; }
      function setStatus(m) { els.status.textContent = m || ''; }
      function clearResult() { els.result.innerHTML = ''; hide(els.result); setStatus(''); setHeadScores(null); }
      // Reset to the clean scanning state so it's obvious you can select new text
      // and scan again. Past versions stay saved (the picker returns after the next scan).
      function onNewScan() {
        clearResult();
        hide(els.versionRow);
        refreshSelection();
        setStatus('Select new text in your document, then scan.');
      }
      function setupErr(m) { if (!m) { els.setupError.hidden = true; els.setupError.textContent = ''; } else { els.setupError.textContent = m; els.setupError.hidden = false; } }
      function cleanErr(e) { return (e && e.message) ? e.message : 'Something went wrong.'; }
      function handleErr(e) {
        var m = cleanErr(e);
        if (m === 'NO_SELECTION') { setStatus('Highlight some text in the document first, then scan.'); return; }
        if (m === 'NO_CREDITS') { setStatus("You're out of credits. Top up at draftproof.app/buy."); return; }
        if (m === 'BAD_KEY' || m === 'NO_KEY') { google.script.run.withSuccessHandler(applyKeyInfo).clearKey(); setupErr('Your API key was rejected. Paste a current key.'); return; }
        setStatus('Couldn’t scan: ' + m);
      }
      function showFatal(e) { document.getElementById('app').innerHTML = '<p class="err">' + esc(cleanErr(e)) + '</p>'; }
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
      function escAttr(s) { return String(s || '').replace(/[^a-z0-9_-]/gi, ''); }
    </script>
  </body>
</html>
